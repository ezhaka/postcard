before-command: |
  #!/bin/bash
  set -e

  # Install dependencies
  npm ci
preview-commands:
  - id: vite-dev-server
    title: Vite Dev Server
    description: React + TypeScript frontend application served by Vite development
      server with hot module replacement (HMR)
    command: |
      #!/bin/bash
      set -e

      # Start Vite dev server on 0.0.0.0 to make it accessible
      npm run dev -- --host 0.0.0.0
preview-port: 5173
